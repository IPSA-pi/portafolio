name: Scrape new music

on:
  schedule:
    # Daily at 08:00 UTC. Adjust freely — nodata.tv posts in bursts, not
    # continuously, so once a day is enough for a worklist (not a live feed).
    - cron: '0 8 * * *'
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/scrape-music.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
      # Tidal availability pre-check. Skips itself (exit 0) if TIDAL secrets
      # aren't set yet, so this step is a no-op until Stage 2 creds exist.
      - run: node scripts/enrich-music.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
      # Spotify availability pre-check. Skips itself (exit 0) if SPOTIFY secrets
      # aren't set yet.
      - run: node scripts/enrich-spotify.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
