name: Scrape new music

on:
  schedule:
    # Daily at 13:00 UTC = 6am Pacific (Victoria BC) during PDT. GitHub cron is
    # UTC-only with no DST support, so in winter (PST) this lands at 5am local.
    # nodata.tv posts in bursts, not continuously, so once a day is plenty.
    - cron: '0 13 * * *'
  workflow_dispatch: {} # allows manual "Run workflow" from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/scrape-music.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
      # Tidal availability pre-check. Skips itself (exit 0) if TIDAL secrets
      # aren't set yet, so this step is a no-op until Stage 2 creds exist.
      - run: node scripts/enrich-music.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
          TIDAL_CLIENT_ID: ${{ secrets.TIDAL_CLIENT_ID }}
          TIDAL_CLIENT_SECRET: ${{ secrets.TIDAL_CLIENT_SECRET }}
      # Spotify availability pre-check. Skips itself (exit 0) if SPOTIFY secrets
      # aren't set yet. Runs even when an earlier step failed (`!cancelled()`):
      # each enrich script now exits non-zero if every one of its searches
      # fails, and one dead provider must not skip the other's pre-check. If
      # the scrape step is what failed, this still does useful work — it
      # enriches whatever rows are already sitting unchecked.
      - if: ${{ !cancelled() }}
        run: node scripts/enrich-spotify.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      # Apple Music availability pre-check. No secrets: it queries the public
      # iTunes Search API. Same `!cancelled()` guard as above so a failure
      # upstream doesn't skip it. Rate-limited, so it walks the backlog 100 rows
      # per run rather than clearing it in one go.
      - if: ${{ !cancelled() }}
        run: node scripts/enrich-apple.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DB_LABEL: prod
