<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark light" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon.ico" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<script>
			try {
				// Mobile defaults to dark regardless of the OS setting; desktop still
				// follows prefers-color-scheme. A stored choice always wins. Keep this
				// in sync with getInitialTheme() in src/lib/stores/theme.ts.
				const prefersDark = matchMedia('(max-width: 767px)').matches
					|| matchMedia('(prefers-color-scheme: dark)').matches;
				const t = localStorage.getItem('theme') || (prefersDark ? 'dark' : 'light');
				if (t === 'dark') document.documentElement.classList.add('dark');
			} catch(e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Cloudflare Web Analytics. Installed by hand on purpose: automatic edge
		     injection never fired here, because every page is served by the Worker
		     rather than a conventional proxied origin. The zone's RUM setting is
		     therefore "Enable with JS Snippet installation". The token is public —
		     it ships in the HTML of every page — so it belongs in source, not in an
		     env var. Cookieless: sets nothing on the visitor's device. -->
		<script
			type="module"
			src="https://static.cloudflareinsights.com/beacon.min.js"
			data-cf-beacon='{"token": "d7bfb4ad5936488cab88411e13440a8b"}'
		></script>
	</body>
</html>
